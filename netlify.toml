[build]
  publish = "public"
  functions = "netlify/functions"

# Netlify-side minification of the unbundled CSS/JS (no local build step)
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = false
  minify = true
[build.processing.js]
  bundle = false
  minify = true

# Redirect www to non-www (canonical consolidation).
# The .html -> extensionless 301s live in public/_redirects.
[[redirects]]
  from = "https://www.pauls-painting.com/*"
  to = "https://pauls-painting.com/:splat"
  status = 301
  force = true

# Security headers + HSTS for all paths (HSTS: no includeSubDomains, no preload)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# CSS/JS keep stable file names, so cache for an hour and revalidate
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML pages - short cache, always revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
